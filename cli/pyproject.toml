[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mvote"
version = "0.1.0"
description = "CLI for creating and configuring mVote participatory sticky-note voting sessions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [
  { name = "Valentín Quiroz de la Sierra" },
  { name = "Marissa Ledesma" },
]
keywords = ["cbpr", "participatory-research", "dot-voting", "research-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "qrcode[pil]>=7.4",
  "click>=8.1",
  "firebase-admin>=6.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
]

[project.scripts]
mvote = "mvote.cli:main"

[tool.setuptools.packages.find]
include = ["mvote*"]
