# Release workflow for the mvote command-line tool (SPEC-distribution in MalverdeSoftware/malverdesoftware).
# Every run builds the sdist and wheel, runs `twine check --strict` and scripts/check-cli-release.py,
# installs the wheel, and keeps the files as an artifact. A tag `v<version>` also publishes to PyPI
# through trusted publishing (OIDC) in the `pypi` environment; no token is stored. The upload runs
# only while the repository variable PYPI_PUBLISH is 'true'. To upload a version that was tagged
# while it was off, set the variable and run this workflow by hand on that tag.
name: CLI release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'cli/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'scripts/check-cli-release.py'
      - '.github/workflows/cli-release.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: LICENSE and NOTICE copies match the root
        run: python scripts/check-cli-release.py
      - name: Build sdist and wheel
        working-directory: cli
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check the built files
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python scripts/check-cli-release.py --dist --tag "${GITHUB_REF_NAME}"
          else
            python scripts/check-cli-release.py --dist
          fi
      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install --quiet cli/dist/*.whl
          /tmp/wheel-test/bin/mvote --version
          /tmp/wheel-test/bin/mvote --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: mvote-cli
          path: cli/dist/*
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mvote/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mvote-cli
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
