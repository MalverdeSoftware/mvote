name: Verify web app
on:
  push:
    paths: ['webapp/**', 'scripts/**', '.node-version', '.github/workflows/webapp-tests.yml']
  pull_request:
    paths: ['webapp/**', 'scripts/**', '.node-version', '.github/workflows/webapp-tests.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run build:demo
      - uses: actions/upload-artifact@v4
        with:
          name: vote-build-manifest
          path: .phase0/build-manifest.json
          include-hidden-files: true
